name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Harden dependency downloads: retry transient failures and disable HTTP/2
  # multiplexing, which causes intermittent crates.io "HTTP2 framing layer"
  # download errors on GitHub runners.
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  test:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Path dependencies retain their upstream formatting; check Luvus itself.
      - run: cargo fmt --package luvus --check
      # `-D warnings` is scoped to clippy on our own crate — NOT a global
      # RUSTFLAGS, which would also fail on harmless dependency warnings.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Validate terminal backend contract
        run: |
          python3 examples/uhp/terminal/consumer.py --fixtures
          python3 examples/uhp/terminal/mock_conformance.py
          python3 examples/uhp/consumer.py
          cargo build --locked
          python3 examples/uhp/terminal/live_conformance.py --luvus target/debug/luvus
          python3 examples/uhp/terminal/failure_conformance.py --luvus target/debug/luvus
      - name: Test terminal support crates
        run: |
          cargo test --manifest-path vendor/vte/Cargo.toml --lib
          cargo test --manifest-path vendor/alacritty_terminal/Cargo.toml --lib
      # Cargo strips local patches from published manifests. Verify the exact
      # three-crate registry graph so `cargo install luvus` cannot regress.
      - name: Verify publishable crate graph
        run: |
          cargo package --allow-dirty --manifest-path vendor/vte/Cargo.toml
          cargo package --allow-dirty --manifest-path vendor/alacritty_terminal/Cargo.toml \
            --config 'patch.crates-io.luvus-vte.path="vendor/vte"'
          cargo package --allow-dirty \
            --config 'patch.crates-io.luvus-vte.path="vendor/vte"' \
            --config 'patch.crates-io.luvus-alacritty-terminal.path="vendor/alacritty_terminal"'

  # macOS is a primary platform and ships native Apple-silicon/Intel binaries;
  # run the full test suite there too, not just at release-tag time.
  macos:
    name: macos test
    runs-on: macos-14
    env:
      SQLITE3_LIB_DIR: /usr/lib
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - name: Validate terminal backend contract
        run: |
          python3 examples/uhp/terminal/consumer.py --fixtures
          python3 examples/uhp/terminal/mock_conformance.py
          python3 examples/uhp/consumer.py
          cargo build --locked
          python3 examples/uhp/terminal/live_conformance.py --luvus target/debug/luvus
          python3 examples/uhp/terminal/failure_conformance.py --luvus target/debug/luvus

  binary-size:
    name: macos binary size
    runs-on: macos-14
    permissions:
      contents: read
    env:
      SQLITE3_LIB_DIR: /usr/lib
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package measured binary
        run: COPYFILE_DISABLE=1 tar -C target/release -czf target/luvus-size.tar.gz luvus
      - name: Check reviewed baseline
        run: |
          python3 scripts/check-binary-size.py \
            --target aarch64-apple-darwin \
            --binary target/release/luvus \
            --archive target/luvus-size.tar.gz

  windows:
    name: windows protocol · ConPTY
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --package luvus --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Test Windows protocol boundaries
        shell: pwsh
        run: |
          cargo test --locked platform::windows::tests
          cargo test --locked app::cwd::tests
          cargo test --locked platform::tests::no_window_keeps_the_command_working
          cargo test --locked ipc::transport::windows_
          cargo test --locked app::backend::tests
          cargo test --locked terminal::backend::tests
          cargo test --locked altgr
          cargo test --locked diff::git::tests::tree_tint_uses_nested_visible_spelling_and_new_rename_path
          cargo test --locked agent::tests::claude_project_dir_encodes_every_non_alphanumeric
      - name: Validate published protocol fixtures
        shell: pwsh
        run: |
          python examples/uhp/terminal/consumer.py --fixtures
          if ($LASTEXITCODE -ne 0) { throw "UHP terminal fixture validation failed" }
          python examples/uhp/consumer.py
          if ($LASTEXITCODE -ne 0) { throw "UHP fixture validation failed" }
      - name: Validate named pipes and ConPTY live
        shell: pwsh
        run: |
          cargo build --locked
          if ($LASTEXITCODE -ne 0) { throw "Windows debug build failed" }
          .\examples\uhp\terminal\live_conformance.ps1 `
            -Luvus .\target\debug\luvus.exe

  # Known-vulnerability scan of the dependency tree (RustSec advisory DB).
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  # Validate the Nix flake (packaging for NixOS / `nix run`). Evaluates every
  # output and builds the package, so a broken derivation fails CI instead of
  # only surfacing when a Nix user tries to install. Reproducible once flake.lock
  # is committed; until then it resolves nixos-unstable fresh each run.
  nix:
    name: nix flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # `flake check` type-checks/evaluates all outputs; `build` compiles the
      # package so the wrapped binary is proven to link.
      - run: nix flake check --print-build-logs
      - run: nix build --print-build-logs
